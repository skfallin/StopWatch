name: StopWatch
options:
  developmentLanguage: en
  bundleIdPrefix: dev.stopwatch
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: 22
targets:
  StopWatch:
    type: application
    platform: iOS
    sources: [StopWatch]
    dependencies:
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stopwatch.companion
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: StopWatch/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        CFBundleDisplayName: StopWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: "Connect your StopWatch to manage settings, home controls and voice notes."
        NSSpeechRecognitionUsageDescription: "Transcribe notes recorded on StopWatch. Transcription happens on this iPhone."
        NSLocalNetworkUsageDescription: "Send Badge images and GIFs and receive voice notes from StopWatch over your local Wi-Fi network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  StopWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StopWatchTests]
    dependencies:
      - target: StopWatch
schemes:
  StopWatch:
    build:
      targets:
        StopWatch: all
    test:
      targets: [StopWatchTests]
