name: StopWatch
options:
  bundleIdPrefix: dev.stopwatch
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: 15
targets:
  StopWatch:
    type: application
    platform: iOS
    sources: [StopWatch]
    dependencies:
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stopwatch.companion
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: StopWatch/Info.plist
      properties:
        CFBundleDisplayName: StopWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: "Collega il tuo StopWatch per gestire impostazioni, casa e note vocali."
        NSSpeechRecognitionUsageDescription: "Trasforma in testo le note registrate sul tuo StopWatch. La trascrizione avviene su questo iPhone."
        NSLocalNetworkUsageDescription: "Invia immagini e GIF al Badge e ricevi rapidamente le note vocali dal tuo StopWatch tramite la rete Wi-Fi locale."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  StopWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StopWatchTests]
    dependencies:
      - target: StopWatch
schemes:
  StopWatch:
    build:
      targets:
        StopWatch: all
    test:
      targets: [StopWatchTests]
