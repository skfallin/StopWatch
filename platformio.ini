[platformio]
default_envs = stopwatch
core_dir = .platformio

[env:stopwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
monitor_speed = 115200
; TinyUSB composite HID + CDC on the native USB-C port; ROM download remains available.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; Serialize callback registration and dispatch on the two ESP32 cores.
    -DNETWORK_EVENTS_MUTEX
lib_deps =
    https://github.com/m5stack/M5Unified.git#0.2.27
    https://github.com/m5stack/M5GFX.git#0.2.34
    bblanchon/ArduinoJson@7.4.2

; Explicit opt-in: software FIDO prototype, test accounts only.
[env:stopwatch-lab]
extends = env:stopwatch
build_flags =
    ${env:stopwatch.build_flags}
    -DSTOPWATCH_FIDO_LAB
