name: Beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Firmware and host checks
        run: python tools/verify.py --firmware --lab ${{ runner.os == 'macOS' && '--swift' || '' }}
      - name: Unsigned iOS simulator build
        if: runner.os == 'macOS'
        run: >-
          xcodebuild -project ios/StopWatch.xcodeproj -scheme StopWatch
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/stopwatch-ci CODE_SIGNING_ALLOWED=NO build
